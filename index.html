.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:15px}.analytics-bars{height:250px;display:flex;align-items:flex-end;gap:12px;padding-top:15px}.daybar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}.bar{width:28px;max-width:100%;background:linear-gradient(#8d7bff,#6955e8);border-radius:7px 7px 2px 2px;min-height:5px}.bar.today{background:linear-gradient(#f487b9,#df5a95)}.bar-label{font:500 9px 'DM Mono';color:var(--muted);margin-top:8px}.metric{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:12px 0;font-size:12px}.metric:last-child{border:0}

.empty{border:1px dashed var(--line);border-radius:16px;padding:45px;text-align:center;color:var(--muted);font-size:12px}.empty b{display:block;color:var(--ink);font:600 17px 'Space Grotesk';margin-bottom:5px}
.view{display:none}.view.active{display:block}.footer{display:flex;justify-content:space-between;color:var(--muted);font:500 9px 'DM Mono';padding:12px 3px}.mobile-nav{display:none}
@media(max-width:1050px){.sidebar{width:205px}.main{width:calc(100% - 205px);margin-left:205px;padding:20px}.dashboard-grid,.grid2{grid-template-columns:1fr}.kpi-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.sidebar{display:none}.main{width:100%;margin:0;padding:13px 10px 72px}.topbar{align-items:flex-start}.topbar h1{font-size:23px}.date-label{min-width:125px;font-size:10px}.hero{padding:22px}.hero h2{font-size:32px}.kpi-grid{gap:7px}.kpi{padding:12px}.quick-add{grid-template-columns:1fr 1fr}.quick-add input:first-child{grid-column:1/-1}.quick-add button{grid-column:2}.task{grid-template-columns:29px 1fr auto}.task .priority{grid-column:2}.task .health{grid-column:2}.task .icon:last-child{grid-row:1/3}.calendar{gap:3px}.cal-day{min-height:56px;padding:5px}.timer-display{font-size:62px}.mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(6,1fr);left:7px;right:7px;bottom:7px;background:rgba(255,255,255,.94);backdrop-filter:blur(15px);border:1px solid var(--line);border-radius:16px;padding:4px;z-index:90;box-shadow:0 15px 35px rgba(45,40,100,.13)}.dark .mobile-nav{background:rgba(24,24,32,.96)}.mobile-nav button{border:0;background:transparent;color:var(--muted);border-radius:11px;padding:6px 2px;font-size:8px}.mobile-nav button.active{background:#f0edff;color:var(--purple)}.dark .mobile-nav button.active{background:#292542}.mobile-nav span{display:block;font-size:14px;margin-bottom:2px}.footer{display:none}}

<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brand-mark">✓</div><div><strong>Daily Ledger</strong><small>Personal productivity</small></div></div>
  <div class="nav-title">Workspace</div>
  <nav class="nav" id="sideNav">
    <button data-view="dashboard" class="active"><span class="nav-icon">⌂</span>Dashboard</button>
    <button data-view="tasks"><span class="nav-icon">✓</span>My Tasks</button>
    <button data-view="focus"><span class="nav-icon">◷</span>Focus Session</button>
    <button data-view="calendar"><span class="nav-icon">▦</span>Calendar</button>
    <button data-view="analytics"><span class="nav-icon">◒</span>Analytics</button>
  </nav>
  <div class="nav-title" style="margin-top:24px">System</div>
  <nav class="nav"><button data-view="settings"><span class="nav-icon">⚙</span>Preferences</button></nav>
  <div class="sidebar-bottom"><span class="dot"></span><span id="dbStatus">Database ready</span></div>
</aside>

<main class="main"><div class="content">
  <div class="topbar">
    <div><p class="eyebrow">Daily Task Ledger</p><h1 id="pageTitle">Dashboard</h1></div>
    <div class="top-actions">
      <div class="datebar"><button data-action="prev">‹</button><span class="date-label" id="topDate"></span><button data-action="next">›</button></div>
      <button class="btn" data-action="today">Today</button>
    </div>
  </div>
  <section class="view active" id="view-dashboard"></section>
  <section class="view" id="view-tasks"></section>
  <section class="view" id="view-focus"></section>
  <section class="view" id="view-calendar"></section>
  <section class="view" id="view-analytics"></section>
  <section class="view" id="view-settings"></section>
  <div class="footer"><span>Daily Ledger V2 · Local IndexedDB</span><span id="saveStatus">Ready</span></div>
</div></main>
</div>

<div class="mobile-nav" id="mobileNav">
<button data-view="dashboard" class="active"><span>⌂</span>Home</button><button data-view="tasks"><span>✓</span>Tasks</button><button data-view="focus"><span>◷</span>Focus</button><button data-view="calendar"><span>▦</span>Calendar</button><button data-view="analytics"><span>◒</span>Stats</button><button data-view="settings"><span>⚙</span>More</button>
</div>

<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>

<script>
(function(){
'use strict';
const DB='DailyTaskLedgerDB', VERSION=2, STORE='days', SETTINGS='settings';
const P={low:'Low',medium:'Medium',high:'High'};
let state={date:new Date(),day:{tasks:[],rolledOver:false},view:'dashboard',filter:'all',tag:'all',week:[],month:new Date(),timer:{seconds:25*60,running:false,mode:'Focus',interval:null,taskId:''},theme:'light'};

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{let p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])};
const add=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmt=d=>d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const short=d=>d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const esc=s=>{let x=document.createElement('div');x.textContent=s||'';return x.innerHTML};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const today=()=>{let n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const completion=day=>day.tasks.length?Math.round(day.tasks.filter(t=>t.done).length/day.tasks.length*100):0;
const dueHealth=t=>{
 if(t.done)return ['Completed','track'];
 if(!t.due)return ['No due date','track'];
 let a=parse(t.due), b=today(), diff=Math.round((a-b)/86400000);
 if(diff<0)return [Math.abs(diff)+'d overdue','overdue'];
 if(diff===0)return ['Due today','today'];
 if(diff===1)return ['Due tomorrow','soon'];
 if(diff<=3)return ['Due in '+diff+'d','soon'];
 return ['On track','track'];
};
function setStatus(x){$('saveStatus').textContent=x;$('dbStatus').textContent=x}

function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,VERSION);r.onupgradeneeded=()=>{let db=r.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'date'});if(!db.objectStoreNames.contains(SETTINGS))db.createObjectStore(SETTINGS,{keyPath:'key'})};r.onsuccess=()=>res(state.db=r.result);r.onerror=()=>rej(r.error)})}
function getDay(d){return new Promise((res,rej)=>{let r=state.db.transaction(STORE,'readonly').objectStore(STORE).get(key(d));r.onsuccess=()=>res(r.result||{date:key(d),tasks:[],rolledOver:false});r.onerror=()=>rej(r.error)})}
function putDay(d){return new Promise((res,rej)=>{let r=state.db.transaction(STORE,'readwrite').objectStore(STORE).put({date:key(state.date),tasks:d.tasks,rolledOver:!!d.rolledOver});r.onsuccess=res;r.onerror=()=>rej(r.error)})}
function allDays(){return new Promise((res,rej)=>{let r=state.db.transaction(STORE,'readonly').objectStore(STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function getSetting(k){return new Promise((res,rej)=>{let r=state.db.transaction(SETTINGS,'readonly').objectStore(SETTINGS).get(k);r.onsuccess=()=>res(r.result?.value);r.onerror=()=>rej(r.error)})}
function setSetting(k,v){return new Promise((res,rej)=>{let r=state.db.transaction(SETTINGS,'readwrite').objectStore(SETTINGS).put({key:k,value:v});r.onsuccess=res;r.onerror=()=>rej(r.error)})}

async function rollover(){
 let last=await getSetting('lastRollover'), now=key(today());
 if(!last){await setSetting('lastRollover',now);return}
 let cur=last;
 while(cur<now){
   let d=parse(cur), next=add(d,1), old=await getDay(d), undone=old.tasks.filter(t=>!t.done);
   if(undone.length){
     old.tasks=old.tasks.filter(t=>t.done);old.rolledOver=true;
     await new Promise((res,rej)=>{let r=state.db.transaction(STORE,'readwrite').objectStore(STORE).put(old);r.onsuccess=res;r.onerror=rej});
     let nd=await getDay(next);
     undone.forEach(t=>{t.carriedFrom=t.carriedFrom||cur;nd.tasks.push(t)});
     await new Promise((res,rej)=>{let r=state.db.transaction(STORE,'readwrite').objectStore(STORE).put(nd);r.onsuccess=res;r.onerror=rej});
   }
   cur=key(next);
 }
 await setSetting('lastRollover',now);
}
async function load(){state.day=await getDay(state.date);state.week=[];for(let i=6;i>=0;i--){let d=add(today(),-i);state.week.push({date:d,data:await getDay(d)})}}
async function save(){await putDay(state.day);setStatus('Saved');render()}

function streak(){
 let s=0;for(let i=state.week.length-1;i>=0;i--){let d=state.week[i].data;if(d.tasks.length&&d.tasks.every(t=>t.done)&&!d.rolledOver)s++;else break}return s;
}
function top3(){
 return [...state.day.tasks].filter(t=>!t.done).sort((a,b)=>{
   let ha=dueHealth(a)[1],hb=dueHealth(b)[1],score=x=>(x.priority==='high'?30:x.priority==='medium'?15:5)+(x.due?(dueHealth(x)[1]==='overdue'?40:dueHealth(x)[1]==='today'?30:10):0);
   return score(b)-score(a);
 }).slice(0,3);
}
function healthCounts(){
 let c={overdue:0,today:0,track:0};state.day.tasks.filter(t=>!t.done).forEach(t=>{let h=dueHealth(t)[1];if(h==='overdue')c.overdue++;else if(h==='today')c.today++;else c.track++});return c;
}
function taskRow(t){
 let h=dueHealth(t),meta=(t.due?'Due '+short(parse(t.due)):'No due date')+(t.carriedFrom?' · carried from '+short(parse(t.carriedFrom)):'');
 return `<div class="task ${t.done?'done':''}">
 <button class="check ${t.done?'done':''}" data-action="toggle" data-id="${t.id}"></button>
 <div><div class="task-title">${esc(t.text)}</div><div class="task-meta">${esc(meta)}${t.tags?.length?' · '+t.tags.map(x=>'#'+esc(x)).join(' '):''}</div></div>
 <span class="priority ${t.priority}">${P[t.priority]}</span>
 <span class="health ${h[1]}">${h[0]}</span>
 <button class="icon" data-action="edit" data-id="${t.id}">⋯</button>
 </div>`;
}
function dashboard(){
 let done=state.day.tasks.filter(t=>t.done).length,total=state.day.tasks.length,pct=completion(state.day),hc=healthCounts(),t3=top3();
 let top=t3.length?t3.map((t,i)=>{let h=dueHealth(t);return `<div class="top3-item"><div class="rank">${String(i+1).padStart(2,'0')}</div><div><div class="task-title">${esc(t.text)}</div><div class="task-meta">${P[t.priority]} priority${t.due?' · '+esc(h[0]):''}</div></div><button class="btn small primary" data-action="focus-task" data-id="${t.id}">Focus</button></div>`}).join(''):`<div class="empty"><b>You're clear 🎉</b>No open tasks for today.</div>`;
 return `<div class="dashboard-grid">
 <div class="hero"><p class="eyebrow">Your command center</p><h2>Make today count.</h2><p>${total?`You have <b>${total-done} tasks</b> remaining. Start with the work that matters most.`:'Your task space is ready. Add something you want to accomplish.'}</p>
 <div class="hero-actions"><button class="btn primary" data-action="focus-top">Start Top Focus</button><button class="btn" data-view="tasks">Manage tasks</button></div>
 <div class="hero-kpis"><span class="pill">✓ ${done} completed</span><span class="pill">◷ ${total-done} remaining</span><span class="pill">🔥 ${streak()} day streak</span></div></div>
 <div class="focus-panel"><h3>Today's Focus</h3><p>Completion progress</p><div class="progress-ring" style="--pct:${pct}"><b>${pct}%</b></div><div class="metric"><span>Focus readiness</span><b>${pct>=70?'Excellent':pct>=40?'Good':'Getting started'}</b></div></div>
 </div>
 <div class="kpi-grid">
 <div class="kpi"><div class="kpi-label">Completion</div><div class="kpi-value">${total?pct+'%':'—'}</div><div class="kpi-sub">${done} of ${total} done</div></div>
 <div class="kpi"><div class="kpi-label">Pending</div><div class="kpi-value">${total-done}</div><div class="kpi-sub">${state.day.tasks.filter(t=>!t.done&&t.priority==='high').length} high priority</div></div>
 <div class="kpi"><div class="kpi-label">Overdue</div><div class="kpi-value" style="color:var(--red)">${hc.overdue}</div><div class="kpi-sub">needs attention</div></div>
 <div class="kpi"><div class="kpi-label">Focus time</div><div class="kpi-value">${focusMinutes()}m</div><div class="kpi-sub">today</div></div>
 </div>
 ${hc.overdue?`<div class="alert"><b>⚠ ${hc.overdue} overdue task${hc.overdue>1?'s':''}</b>Review your overdue work before adding more to today.</div>`:''}
 <div class="grid2">
 <div class="panel"><div class="section-head"><div><h2>Today's Top 3</h2><p>Automatically prioritized by urgency and importance.</p></div><button class="btn small" data-view="tasks">View all</button></div><div class="top3">${top}</div></div>
 <div class="panel"><div class="section-head"><div><h2>Task Health</h2><p>Where your workload stands.</p></div></div>
 <div class="metric"><span>🔴 Overdue</span><b>${hc.overdue}</b></div><div class="metric"><span>🟠 Due today</span><b>${hc.today}</b></div><div class="metric"><span>🟢 On track</span><b>${hc.track}</b></div><div class="metric"><span>🔥 Streak</span><b>${streak()} days</b></div></div>
 </div>
 <div class="panel" style="margin-top:15px"><div class="section-head"><div><h2>Recent tasks</h2><p>${fmt(state.date)}</p></div><button class="btn small primary" data-action="new-task">+ New task</button></div>${state.day.tasks.length?`<div class="task-list">${state.day.tasks.slice(0,5).map(taskRow).join('')}</div>`:`<div class="empty"><b>No tasks yet</b>Add your first task to get started.</div>`}</div>`;
}
function addForm(){return `<form class="quick-add" id="addForm"><input name="text" maxlength="160" placeholder="What needs to get done?"><select name="priority"><option value="medium">Medium</option><option value="high">High</option><option value="low">Low</option></select><input name="due" type="date"><input name="tags" placeholder="Tags e.g. work, label"><button>+</button></form>`}
function tasksView(){
 let list=state.day.tasks.filter(t=>state.filter==='all'||(state.filter==='active'&&!t.done)||(state.filter==='completed'&&t.done)).filter(t=>state.tag==='all'||(t.tags||[]).includes(state.tag));
 let tags=[...new Set(state.day.tasks.flatMap(t=>t.tags||[]))];
 return `<div class="panel"><div class="section-head"><div><h2>My Tasks</h2><p>${fmt(state.date)} · ${state.day.tasks.length} total tasks</p></div><button class="btn primary" data-action="focus-top">Start Top Focus</button></div>${addForm()}<div class="filters"><button class="filter ${state.filter==='all'?'active':''}" data-action="filter" data-filter="all">All</button><button class="filter ${state.filter==='active'?'active':''}" data-action="filter" data-filter="active">Active</button><button class="filter ${state.filter==='completed'?'active':''}" data-action="filter" data-filter="completed">Completed</button>${tags.map(t=>`<button class="filter ${state.tag===t?'active':''}" data-action="tag" data-tag="${esc(t)}">#${esc(t)}</button>`).join('')}</div>${list.length?`<div class="task-list">${list.map(taskRow).join('')}</div>`:`<div class="empty"><b>Nothing here</b>Try another filter or add a new task.</div>`}</div>`;
}
function focusMinutes(){return state.day.tasks.reduce((a,t)=>a+(t.focusMinutes||0),0)}
function focusView(){
 let options=state.day.tasks.filter(t=>!t.done).map(t=>`<option value="${t.id}" ${state.timer.taskId===t.id?'selected':''}>${esc(t.text)}</option>`).join('');
 let m=Math.floor(state.timer.seconds/60),s=state.timer.seconds%60;
 return `<div class="grid2"><div class="panel timer-wrap"><div class="timer-mode">${state.timer.mode} session</div><div class="timer-display">${pad(m)}:${pad(s)}</div><div class="timer-task"><select id="focusTask"><option value="">Choose a task for this session</option>${options}</select></div><div class="timer-controls"><button class="btn primary" data-action="timer">${state.timer.running?'Pause':'Start'}</button><button class="btn" data-action="reset">Reset</button></div><p style="margin-top:18px;color:var(--muted);font-size:11px">25 minutes focus · 5 minutes break. Finish the session and time is added to the selected task.</p></div>
 <div class="panel"><div class="section-head"><div><h2>Focus momentum</h2><p>Turn focused time into progress.</p></div></div><div class="metric"><span>Focused today</span><b>${focusMinutes()} min</b></div><div class="metric"><span>Completed today</span><b>${state.day.tasks.filter(t=>t.done).length}</b></div><div class="metric"><span>Remaining</span><b>${state.day.tasks.filter(t=>!t.done).length}</b></div><div class="metric"><span>Completion</span><b>${completion(state.day)}%</b></div></div></div>`;
}
function calendarView(){
 let d=new Date(state.month.getFullYear(),state.month.getMonth(),1),start=d.getDay(),days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),prev=new Date(d.getFullYear(),d.getMonth(),0).getDate(),cells='';
 for(let i=0;i<42;i++){let n=i-start+1,dd,muted=false;if(n<1){n=prev+n;dd=new Date(d.getFullYear(),d.getMonth()-1,n);muted=true}else if(n>days){n-=days;dd=new Date(d.getFullYear(),d.getMonth()+1,n);muted=true}else dd=new Date(d.getFullYear(),d.getMonth(),n);let wd=state.week.find(x=>key(x.date)===key(dd));let count=wd?wd.data.tasks.length:0;cells+=`<button class="cal-day ${muted?'muted':''} ${key(dd)===key(today())?'today':''}" data-action="cal-day" data-date="${key(dd)}"><strong>${n}</strong>${count?`<div><span class="cal-dot"></span><small>${count} task${count>1?'s':''}</small></div>`:''}</button>`}
 return `<div class="panel"><div class="section-head"><div><h2>Calendar</h2><p>Plan and review your workload by date.</p></div><div class="datebar"><button data-action="month-prev">‹</button><span class="date-label">${d.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</span><button data-action="month-next">›</button></div></div><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="cal-head">${x}</div>`).join('')}${cells}</div></div>`;
}
function analyticsView(){
 let total=state.week.reduce((a,w)=>a+w.data.tasks.length,0),done=state.week.reduce((a,w)=>a+w.data.tasks.filter(t=>t.done).length,0),focus=state.week.reduce((a,w)=>a+w.data.tasks.reduce((s,t)=>s+(t.focusMinutes||0),0),0);
 let bars=state.week.map(w=>{let p=completion(w.data);return `<div class="daybar"><div class="bar ${key(w.date)===key(today())?'today':''}" style="height:${Math.max(5,p)}%"></div><div class="bar-label">${w.date.toLocaleDateString('en-IN',{weekday:'narrow'})}</div></div>`}).join('');
 return `<div class="grid2"><div class="panel"><div class="section-head"><div><h2>Weekly performance</h2><p>Completion percentage by day.</p></div></div><div class="analytics-bars">${bars}</div></div><div class="panel"><div class="section-head"><div><h2>Productivity health</h2><p>Your last 7 days.</p></div></div><div class="metric"><span>Tasks created</span><b>${total}</b></div><div class="metric"><span>Tasks completed</span><b>${done}</b></div><div class="metric"><span>Completion rate</span><b>${total?Math.round(done/total*100):0}%</b></div><div class="metric"><span>Focus time</span><b>${focus} min</b></div><div class="metric"><span>Current streak</span><b>${streak()} days</b></div></div></div>
 <div class="panel" style="margin-top:15px"><div class="section-head"><div><h2>What to improve</h2><p>Simple signals from your task history.</p></div></div><div class="metric"><span>Overdue today</span><b>${healthCounts().overdue}</b></div><div class="metric"><span>Carried-forward tasks</span><b>${state.day.tasks.filter(t=>t.carriedFrom).length}</b></div><div class="metric"><span>High-priority completed</span><b>${state.day.tasks.filter(t=>t.done&&t.priority==='high').length}</b></div></div>`;
}
function settingsView(){
 return `<div class="settings">
 <div class="setting"><h3>Appearance</h3><p>Choose how Daily Ledger looks.</p><div class="segmented"><button class="${state.theme==='light'?'active':''}" data-action="theme" data-theme="light">Light</button><button class="${state.theme==='dark'?'active':''}" data-action="theme" data-theme="dark">Dark</button></div></div>
 <div class="setting"><h3>Smart carry-forward</h3><p>Unfinished tasks are carried to the next day automatically. Daily Ledger keeps their original date so you can see what moved.</p><button class="btn" data-action="rollover-now">Run carry-forward now</button></div>
 <div class="setting"><h3>Data</h3><p>Your tasks are stored locally in this browser. Export a backup before changing devices or clearing browser data.</p><button class="btn primary" data-action="export">Export backup</button> <label class="btn" style="display:inline-block">Import backup<input id="importFile" type="file" accept="application/json" style="display:none"></label> <button class="btn danger" data-action="clear">Clear all data</button></div>
 </div>`;
}
function render(){
 $('topDate').textContent=fmt(state.date);let views={dashboard:dashboard,tasks:tasksView,focus:focusView,calendar:calendarView,analytics:analyticsView,settings:settingsView};
 Object.keys(views).forEach(v=>{$('view-'+v).innerHTML=views[v]();$('view-'+v).classList.toggle('active',state.view===v)});
 document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));
 $('pageTitle').textContent={dashboard:'Dashboard',tasks:'My Tasks',focus:'Focus Session',calendar:'Calendar',analytics:'Analytics',settings:'Preferences'}[state.view];
 document.body.classList.toggle('dark',state.theme==='dark');
}
async function changeDate(d){state.date=d;state.month=new Date(d);state.filter='all';state.tag='all';await load();render()}
async function addTask(form){let text=form.text.value.trim();if(!text)return;let tags=form.tags.value.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);state.day.tasks.push({id:uid(),text,done:false,priority:form.priority.value,due:form.due.value||null,tags,notes:'',focusMinutes:0,carriedFrom:null});await save();form.reset()}
async function toggle(id){let t=state.day.tasks.find(x=>x.id===id);if(t){t.done=!t.done;await save()}}
function openTask(id){
 let t=state.day.tasks.find(x=>x.id===id);if(!t)return;
 let tags=(t.tags||[]).map(x=>`<span class="chip selected">#${esc(x)}</span>`).join('');
 $('modal').innerHTML=`<div class="modal-head"><div><p class="eyebrow">Task details</p><h2>${esc(t.text)}</h2></div><button class="icon" data-action="close-modal">×</button></div>
 <div class="modal-grid"><label>Task</label><input id="mText" value="${esc(t.text)}"><label>Priority</label><select id="mPriority"><option value="low" ${t.priority==='low'?'selected':''}>Low</option><option value="medium" ${t.priority==='medium'?'selected':''}>Medium</option><option value="high" ${t.priority==='high'?'selected':''}>High</option></select><label>Due date</label><input id="mDue" type="date" value="${t.due||''}"><label>Notes</label><textarea id="mNotes" placeholder="Add context, links or instructions...">${esc(t.notes)}</textarea>
 <label>Tags</label><input id="mTags" value="${(t.tags||[]).join(', ')}"><div>${tags}</div></div>
 <div class="ai-box"><b>✨ AI task breakdown</b><p>Use the task wording to create a practical checklist. This local version uses a smart template and does not send your task data to a third-party service.</p><div id="aiSteps"></div><button class="btn small" data-action="breakdown" data-id="${t.id}">Generate breakdown</button></div>
 <div class="modal-actions"><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="save-task" data-id="${t.id}">Save changes</button></div>`;
 $('modalBackdrop').classList.add('open');
}
function breakdown(text){
 let clean=text.replace(/^(create|finish|complete|prepare|update|review|check|send|make|fix)\\s+/i,'').trim()||text;
 return ['Clarify the expected result for '+clean,'Check the latest requirements or reference material','Complete the main work for '+clean,'Review the result for errors or missing details','Mark the task complete and record any follow-up'].map((x,i)=>`<div class="ai-step"><span>${i+1}</span>${esc(x)}</div>`).join('');
}
async function saveTask(id){
 let t=state.day.tasks.find(x=>x.id===id);if(!t)return;
 t.text=$('mText').value.trim()||t.text;t.priority=$('mPriority').value;t.due=$('mDue').value||null;t.notes=$('mNotes').value;t.tags=$('mTags').value.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
 $('modalBackdrop').classList.remove('open');await save();
}
function closeModal(){$('modalBackdrop').classList.remove('open')}
function startFocus(id){
 state.timer.taskId=id||state.timer.taskId||top3()[0]?.id||'';state.view='focus';if(!state.timer.running)toggleTimer();render()
}
function toggleTimer(){
 if(state.timer.running){state.timer.running=false;clearInterval(state.timer.interval)}
 else{state.timer.running=true;clearInterval(state.timer.interval);state.timer.interval=setInterval(tick,1000)}
 render()
}
async function tick(){
 if(!state.timer.running)return;state.timer.seconds--;
 if(state.timer.seconds<=0){
   state.timer.running=false;clearInterval(state.timer.interval);
   let t=state.day.tasks.find(x=>x.id===state.timer.taskId);if(t){t.focusMinutes=(t.focusMinutes||0)+(state.timer.mode==='Focus'?25:5);await save()}
   alert(state.timer.mode+' session complete!');
   state.timer.seconds=state.timer.mode==='Focus'?25*60:5*60;
 }
 render()
}
function resetTimer(){state.timer.running=false;clearInterval(state.timer.interval);state.timer.seconds=state.timer.mode==='Focus'?25*60:5*60;render()}
function exportData(){allDays().then(days=>{let blob=new Blob([JSON.stringify({version:2,exported:new Date().toISOString(),days},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='daily-ledger-v2-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)})}
function importData(file){let r=new FileReader();r.onload=async()=>{try{let o=JSON.parse(r.result);if(!o.days)throw 0;for(let d of o.days)await new Promise((res,rej)=>{let x=state.db.transaction(STORE,'readwrite').objectStore(STORE).put(d);x.onsuccess=res;x.onerror=rej});await load();render();setStatus('Backup imported')}catch(e){alert('Could not import that backup.')}};r.readAsText(file)}
async function clearAll(){if(!confirm('Delete every Daily Ledger task? This cannot be undone.'))return;await new Promise((res,rej)=>{let r=state.db.transaction(STORE,'readwrite').objectStore(STORE).clear();r.onsuccess=res;r.onerror=rej});await load();render();setStatus('Database cleared')}

document.addEventListener('click',async e=>{
 let v=e.target.closest('[data-view]');if(v){state.view=v.dataset.view;render();return}
 let a=e.target.closest('[data-action]');if(!a)return;let x=a.dataset.action;
 if(x==='prev')return changeDate(add(state.date,-1));if(x==='next')return changeDate(add(state.date,1));if(x==='today')return changeDate(today());
 if(x==='filter'){state.filter=a.dataset.filter;render();return}if(x==='tag'){state.tag=a.dataset.tag;render();return}
 if(x==='toggle')return toggle(a.dataset.id);if(x==='edit')return openTask(a.dataset.id);
 if(x==='focus-task')return startFocus(a.dataset.id);if(x==='focus-top')return startFocus();
 if(x==='new-task'){state.view='tasks';render();setTimeout(()=>document.querySelector('#addForm input')?.focus(),50);return}
 if(x==='timer')return toggleTimer();if(x==='reset')return resetTimer();
 if(x==='month-prev'){state.month=new Date(state.month.getFullYear(),state.month.getMonth()-1,1);render();return}
 if(x==='month-next'){state.month=new Date(state.month.getFullYear(),state.month.getMonth()+1,1);render();return}
 if(x==='cal-day')return changeDate(parse(a.dataset.date));
 if(x==='edit')return openTask(a.dataset.id);
 if(x==='close-modal')return closeModal();if(x==='save-task')return saveTask(a.dataset.id);
 if(x==='breakdown'){let t=state.day.tasks.find(q=>q.id===a.dataset.id);if(t)$('aiSteps').innerHTML=breakdown(t.text);return}
 if(x==='theme'){state.theme=a.dataset.theme;await setSetting('theme',state.theme);render();return}
 if(x==='export')return exportData();if(x==='clear')return clearAll();if(x==='rollover-now'){await rollover();await load();render();return}
});
document.addEventListener('submit',e=>{if(e.target.id==='addForm'){e.preventDefault();addTask(e.target)}});
document.addEventListener('change',e=>{if(e.target.id==='focusTask'){state.timer.taskId=e.target.value}if(e.target.id==='importFile'&&e.target.files[0])importData(e.target.files[0])});
$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal()});

async function init(){
 try{await openDB();state.theme=(await getSetting('theme'))||'light';await rollover();state.date=today();state.month=new Date(state.date);await load();setStatus('Database ready');render()}
 catch(e){console.error(e);setStatus('Database unavailable')}
}
init();
})();
</script>
</body>
</html>
