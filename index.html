<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily Task Ledger</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --ink: #1B2430;
    --ink-soft: #2B3547;
    --paper: #ECEFE9;
    --paper-2: #E0E4DB;
    --rule: #B7C0B3;
    --text: #1E2A22;
    --cobalt: #3B5BA5;
    --cobalt-deep: #2C4680;
    --amber: #B5814B;
    --red: #A8503F;
    --gold: #B8912A;
    --muted: #6B7568;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--ink);
    color: var(--text);
    min-height: 100vh;
    padding: 28px 16px 60px;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  .wrap { max-width: 860px; margin: 0 auto; }

  .banner {
    display: none; align-items: center; gap: 10px; background: rgba(184,145,42,0.15);
    border: 1px solid rgba(184,145,42,0.4); color: var(--gold); font-size: 12.5px;
    padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-family: 'IBM Plex Mono', monospace;
  }
  .banner.show { display: flex; }

  .masthead {
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 12px; margin-bottom: 18px; padding: 0 4px;
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--gold); margin: 0 0 2px;
  }
  .title { color: var(--paper); font-size: 28px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }

  .datebar {
    display: flex; align-items: center; gap: 10px; background: var(--ink-soft);
    border-radius: 8px; padding: 6px 8px 6px 14px; color: var(--paper);
  }
  .datebar button { background: none; border: none; color: var(--paper); cursor: pointer;
    padding: 6px; border-radius: 6px; display: flex; align-items: center; }
  .datebar button:hover { background: rgba(236,239,233,0.12); }
  .datebar .today-btn { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.05em;
    color: var(--gold); border: 1px solid rgba(184,145,42,0.5); padding: 4px 8px; }
  .datebar span.dstr { font-family: 'Fraunces', serif; font-size: 15px; min-width: 200px; text-align: center; }

  .streak-badge { display: flex; align-items: center; gap: 6px; color: var(--gold);
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; padding: 0 4px; }

  .dash { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
  @media (max-width: 700px) { .dash { grid-template-columns: repeat(2, 1fr); } }
  .stat-card { background: var(--paper); border-radius: 6px; padding: 16px 16px 14px;
    border: 1px solid rgba(27,36,48,0.06); }
  .stat-card .label { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .stat-card .value { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 600; line-height: 1; color: var(--cobalt-deep); }
  .stat-card .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .stat-card.accent-gold .value { color: var(--gold); }
  .stat-card.accent-red .value { color: var(--red); }

  .spark-bars { display: flex; align-items: flex-end; gap: 5px; height: 38px; margin-top: 8px; }
  .spark-bars .bar { flex: 1; background: var(--cobalt); border-radius: 2px 2px 0 0; opacity: 0.85; min-height: 3px; }
  .spark-bars .bar.is-today { background: var(--gold); }
  .spark-labels { display: flex; gap: 5px; margin-top: 3px; }
  .spark-labels span { flex: 1; text-align: center; font-size: 9px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }

  .panel { background: var(--paper); border-radius: 8px; padding: 22px 22px 24px; }
  .panel h2 { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .panel .panel-sub { font-size: 12px; color: var(--muted); margin: 0 0 16px; }

  form.add-row { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .add-row input[type=text] {
    flex: 1; min-width: 160px; border: 1px solid var(--rule); background: transparent; border-radius: 5px;
    padding: 9px 10px; font-family: 'IBM Plex Sans', sans-serif; font-size: 13.5px; color: var(--text);
  }
  .add-row input[type=text]:focus { outline: 2px solid var(--cobalt); outline-offset: 1px; }
  .add-row select, .add-row input[type=date] {
    border: 1px solid var(--rule); background: var(--paper); border-radius: 5px; font-size: 12.5px;
    padding: 0 6px; color: var(--muted); font-family: 'IBM Plex Sans', sans-serif;
  }
  .add-row button {
    background: var(--cobalt); color: var(--paper); border: none; border-radius: 5px;
    width: 34px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .add-row button:hover { background: var(--cobalt-deep); }

  .filter-row { display: flex; gap: 6px; margin-bottom: 12px; }
  .filter-row button {
    background: transparent; border: 1px solid var(--rule); color: var(--muted); font-size: 11.5px;
    font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.03em; padding: 5px 10px; border-radius: 20px; cursor: pointer;
  }
  .filter-row button.active { background: var(--cobalt); border-color: var(--cobalt); color: var(--paper); }

  ul.entries { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  ul.entries li {
    display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px dashed var(--rule);
  }
  ul.entries li:last-child { border-bottom: none; }
  .stamp {
    width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--cobalt);
    background: transparent; cursor: pointer; flex-shrink: 0; position: relative;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .stamp.done { background: var(--cobalt); transform: rotate(-6deg); }
  .stamp.done::after {
    content: ''; width: 8px; height: 4px; border-left: 2px solid var(--paper);
    border-bottom: 2px solid var(--paper); transform: rotate(-45deg) translate(1px,-1px);
  }
  .entry-main { flex: 1; min-width: 0; }
  .entry-text { font-size: 13.5px; display: block; }
  .entry-text.done { text-decoration: line-through; color: var(--muted); }
  .entry-meta { font-size: 10.5px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; margin-top: 2px; }
  .entry-meta.carried { color: var(--amber); }
  .prio-pill { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.06em;
    text-transform: uppercase; border-radius: 3px; padding: 2px 6px; flex-shrink: 0; }
  .prio-pill.low { color: var(--muted); border: 1px solid var(--rule); }
  .prio-pill.medium { color: var(--amber); border: 1px solid var(--amber); }
  .prio-pill.high { color: var(--red); border: 1px solid var(--red); }
  .del-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px;
    display: flex; opacity: 0.6; }
  .del-btn:hover { color: var(--red); opacity: 1; }
  .empty-note { font-size: 12.5px; color: var(--muted); font-style: italic; padding: 6px 4px 2px; }

  ul.entries li { flex-wrap: wrap; }
  .comment-toggle { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px;
    display: flex; align-items: center; gap: 3px; opacity: 0.6; flex-shrink: 0; font-family: 'IBM Plex Mono', monospace; font-size: 10px; }
  .comment-toggle:hover { opacity: 1; color: var(--cobalt); }
  .comment-toggle.has-content { opacity: 1; color: var(--cobalt); }
  .comment-toggle.open { color: var(--cobalt-deep); opacity: 1; }

  .comment-panel { flex-basis: 100%; width: 100%; margin: 2px 0 8px 30px; padding: 10px 12px; background: var(--paper-2);
    border-radius: 6px; display: flex; flex-direction: column; gap: 8px; }
  .comment-panel textarea {
    width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--rule); border-radius: 5px;
    padding: 8px 9px; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: var(--text);
    background: var(--paper); line-height: 1.4;
  }
  .comment-panel textarea:focus { outline: 2px solid var(--cobalt); outline-offset: 1px; }
  .attach-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .attach-btn {
    display: inline-flex; align-items: center; gap: 6px; background: transparent; border: 1px dashed var(--rule);
    color: var(--muted); font-size: 11.5px; font-family: 'IBM Plex Mono', monospace; padding: 6px 10px;
    border-radius: 5px; cursor: pointer;
  }
  .attach-btn:hover { border-color: var(--cobalt); color: var(--cobalt); }
  .attach-row input[type=file] { display: none; }
  .attachment-chip {
    display: inline-flex; align-items: center; gap: 7px; background: var(--paper); border: 1px solid var(--rule);
    border-radius: 5px; padding: 5px 6px 5px 10px; font-size: 12px; color: var(--text); max-width: 100%;
  }
  .attachment-chip .att-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
  .attachment-chip .att-size { color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; flex-shrink: 0; }
  .attachment-chip a.att-download { color: var(--cobalt); display: flex; flex-shrink: 0; }
  .attachment-chip a.att-download:hover { color: var(--cobalt-deep); }
  .attachment-chip .att-remove { background: none; border: none; color: var(--muted); cursor: pointer; display: flex;
    padding: 2px; flex-shrink: 0; }
  .attachment-chip .att-remove:hover { color: var(--red); }
  .attach-note { font-size: 10.5px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }

  .footer-row { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding: 0 4px; flex-wrap: wrap; gap: 8px; }
  .reset-btn { display: flex; align-items: center; gap: 6px; background: none; border: 1px solid rgba(236,239,233,0.25);
    color: var(--paper); font-size: 12px; padding: 7px 12px; border-radius: 6px; cursor: pointer; }
  .reset-btn:hover { border-color: var(--red); color: var(--red); }
  .storage-note { font-size: 11px; color: rgba(236,239,233,0.5); font-family: 'IBM Plex Mono', monospace; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  var PRIORITIES = ["low", "medium", "high"];
  var PRIORITY_LABEL = { low: "Low", medium: "Medium", high: "High" };

  // ---- storage layer -------------------------------------------------
  // Real localStorage, as requested. Falls back to an in-memory object
  // if localStorage is unavailable (e.g. inside a sandboxed preview),
  // so the app still works for the current session and says so.
  var memoryStore = {};
  var usingMemoryFallback = false;

  function storageAvailable() {
    try {
      var t = "__ls_test__";
      window.localStorage.setItem(t, "1");
      window.localStorage.removeItem(t);
      return true;
    } catch (e) {
      return false;
    }
  }
  usingMemoryFallback = !storageAvailable();

  function storageGet(key) {
    if (usingMemoryFallback) return memoryStore[key] || null;
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  }
  function storageSet(key, value) {
    if (usingMemoryFallback) { memoryStore[key] = value; return true; }
    try { window.localStorage.setItem(key, value); return true; } catch (e) { return false; }
  }

  // ---- date helpers ----------------------------------------------------
  function dateKey(d) {
    var y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }
  function addDays(d, n) { var nd = new Date(d); nd.setDate(nd.getDate() + n); return nd; }
  // "Today" is always resolved in Indian Standard Time, not the device's own
  // timezone. IST (UTC+5:30) runs ahead of most timezones, so a machine set
  // to, say, US or UTC time can still think it's "yesterday" for hours after
  // the date has already turned in India. Extracting the IST calendar date
  // and rebuilding it as a local Date keeps every getFullYear/getMonth/getDate
  // call elsewhere in the app correct without touching the rest of the code.
  function nowIST() {
    var parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Kolkata", year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
    }).formatToParts(new Date());
    var get = function (type) { return +parts.filter(function (p) { return p.type === type; })[0].value; };
    return new Date(get("year"), get("month") - 1, get("day"), get("hour"), get("minute"), get("second"));
  }
  function parseDateKey(key) { var p = key.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function fmtDate(d) { return d.toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long", year: "numeric" }); }
  function fmtNarrow(d) { return d.toLocaleDateString("en-IN", { weekday: "narrow" }); }
  function fmtShort(d) { return d.toLocaleDateString("en-IN", { day: "numeric", month: "short" }); }
  function isSameDay(a, b) { return dateKey(a) === dateKey(b); }
  function uid() { return Math.random().toString(36).slice(2, 9); }
  function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

  function defaultDay() { return { tasks: [], rolledOver: false }; }
  function taskKey(d) { return "worktasks:" + dateKey(d); }
  var META_KEY = "worktasks:meta";

  function loadDay(d) {
    var raw = storageGet(taskKey(d));
    if (!raw) return defaultDay();
    var parsed = JSON.parse(raw);
    if (typeof parsed.rolledOver === "undefined") parsed.rolledOver = false;
    return parsed;
  }
  function saveDay(d, data) { return storageSet(taskKey(d), JSON.stringify(data)); }

  function completionPct(day) {
    if (!day.tasks.length) return null;
    var done = day.tasks.filter(function (t) { return t.done; }).length;
    return Math.round((done / day.tasks.length) * 100);
  }
  // A day only counts as "cleared" if every task assigned to it was actually
  // finished on it -- not if it merely ended up empty because unfinished
  // tasks were carried off to the next day.
  function isFullyDone(day) {
    return day.tasks.length > 0 && !day.rolledOver && day.tasks.every(function (t) { return t.done; });
  }

  // ---- automatic day-to-day rollover -----------------------------------
  // Walks forward from the last day we checked up to (but not including)
  // today. For each past day, any task still unfinished is moved onto the
  // next day's list (tagged with where it came from) and removed from the
  // day it failed to get done on. Handles multi-day gaps (e.g. app not
  // opened for a few days) by cascading day by day.
  function rolloverPastDays() {
    var todayKey = dateKey(nowIST());
    var metaRaw = storageGet(META_KEY);
    var meta = metaRaw ? JSON.parse(metaRaw) : null;

    if (!meta) {
      // First time this feature has run: don't retroactively reshuffle
      // unknown history, just start tracking from today onward.
      storageSet(META_KEY, JSON.stringify({ lastRollover: todayKey }));
      return;
    }

    var cursorKey = meta.lastRollover;
    while (cursorKey < todayKey) {
      var cursorDate = parseDateKey(cursorKey);
      var nextDate = addDays(cursorDate, 1);
      var nextKey = dateKey(nextDate);

      var dayData = loadDay(cursorDate);
      var undone = dayData.tasks.filter(function (t) { return !t.done; });

      if (undone.length) {
        dayData.tasks = dayData.tasks.filter(function (t) { return t.done; });
        dayData.rolledOver = true;
        saveDay(cursorDate, dayData);

        var nextData = loadDay(nextDate);
        undone.forEach(function (t) {
          t.carriedFrom = t.carriedFrom || cursorKey;
          nextData.tasks.push(t);
        });
        saveDay(nextDate, nextData);
      }

      cursorKey = nextKey;
    }

    meta.lastRollover = todayKey;
    storageSet(META_KEY, JSON.stringify(meta));
  }

  // ---- state -------------------------------------------------------
  var state = {
    currentDate: nowIST(),
    day: defaultDay(),
    filter: "all", // all | active | completed
    weekDays: [],
    streak: 0,
    storageOk: true,
    expandedComments: {} // task id -> true, UI-only, not persisted
  };

  function loadCurrentDay() { state.day = loadDay(state.currentDate); }

  function loadWeek() {
    var today = nowIST();
    var days = [];
    for (var i = 6; i >= 0; i--) {
      var d = addDays(today, -i);
      days.push({ date: d, data: loadDay(d) });
    }
    state.weekDays = days;
    var s = 0;
    for (var i = days.length - 1; i >= 0; i--) {
      if (isFullyDone(days[i].data)) s++; else break;
    }
    state.streak = s;
  }

  function persist() {
    state.storageOk = saveDay(state.currentDate, state.day);
  }

  function updateDay(mutator) {
    mutator(state.day);
    persist();
    loadWeek();
    render();
  }

  // ---- actions -------------------------------------------------------
  function goPrevDay() { state.currentDate = addDays(state.currentDate, -1); loadCurrentDay(); render(); }
  function goNextDay() { state.currentDate = addDays(state.currentDate, 1); loadCurrentDay(); render(); }
  function goToday() { state.currentDate = nowIST(); loadCurrentDay(); render(); }

  function addTask(text, priority, due) {
    text = text.trim();
    if (!text) return;
    updateDay(function (d) { d.tasks.push({ id: uid(), text: text, done: false, priority: priority, due: due || null, comment: '', attachment: null }); });
  }
  function toggleTask(id) { updateDay(function (d) { d.tasks.forEach(function (t) { if (t.id === id) t.done = !t.done; }); }); }
  function deleteTask(id) {
    delete state.expandedComments[id];
    updateDay(function (d) { d.tasks = d.tasks.filter(function (t) { return t.id !== id; }); });
  }
  function setFilter(f) { state.filter = f; render(); }

  function toggleComments(id) {
    state.expandedComments[id] = !state.expandedComments[id];
    render();
  }

  // Comment text is saved without a full re-render on every keystroke so the
  // textarea keeps focus and cursor position while typing.
  function editComment(id, value) {
    var t = state.day.tasks.filter(function (x) { return x.id === id; })[0];
    if (!t) return;
    t.comment = value;
    clearTimeout(editComment._t);
    editComment._t = setTimeout(function () { persist(); }, 300);
  }

  var MAX_ATTACHMENT_BYTES = 4 * 1024 * 1024; // 4MB, mindful of localStorage's ~5-10MB total budget

  function attachFile(id, file) {
    if (!file) return;
    if (file.size > MAX_ATTACHMENT_BYTES) {
      window.alert('That file is ' + Math.round(file.size / 1024 / 1024 * 10) / 10 + 'MB. Please attach something under 4MB — everything here is saved into browser storage, which has limited space.');
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      updateDay(function (d) {
        d.tasks.forEach(function (t) {
          if (t.id === id) t.attachment = { name: file.name, size: file.size, type: file.type || 'application/octet-stream', dataUrl: reader.result };
        });
      });
    };
    reader.onerror = function () {
      window.alert('Could not read that file, please try again.');
    };
    reader.readAsDataURL(file);
  }

  function removeAttachment(id) {
    updateDay(function (d) { d.tasks.forEach(function (t) { if (t.id === id) t.attachment = null; }); });
  }

  function resetDay() {
    if (window.confirm("Clear all tasks for " + fmtDate(state.currentDate) + "? This can't be undone.")) {
      updateDay(function (d) { d.tasks = []; });
    }
  }

  // ---- icons -------------------------------------------------------
  var ICONS = {
    chevronLeft: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>',
    chevronRight: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>',
    flame: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 17a2.5 2.5 0 0 0 2.5-2.5c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7.5 7.5 0 1 1-15 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>',
    plus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>',
    trash: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>',
    reset: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>',
    comment: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>',
    paperclip: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>',
    download: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>',
    close: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>'
  };

  // ---- rendering -------------------------------------------------------
  function renderDashboard() {
    var day = state.day;
    var pct = completionPct(day);
    var doneCount = day.tasks.filter(function (t) { return t.done; }).length;
    var pending = day.tasks.length - doneCount;
    var highOpen = day.tasks.filter(function (t) { return !t.done && t.priority === "high"; }).length;

    var bars = state.weekDays.map(function (wd) {
      var s = completionPct(wd.data);
      var isToday = isSameDay(wd.date, nowIST());
      var h = s === null ? 3 : Math.max(s, 3);
      return '<div class="bar' + (isToday ? ' is-today' : '') + '" style="height:' + h + '%" title="' + (s === null ? 'no tasks' : s + '%') + '"></div>';
    }).join('');
    var labels = state.weekDays.map(function (wd) { return '<span>' + fmtNarrow(wd.date) + '</span>'; }).join('');

    return '' +
      '<div class="dash">' +
        '<div class="stat-card">' +
          '<div class="label">Completion</div>' +
          '<div class="value mono">' + (pct === null ? '—' : pct + '%') + '</div>' +
          '<div class="sub">' + doneCount + ' of ' + day.tasks.length + ' done</div>' +
        '</div>' +
        '<div class="stat-card accent-red">' +
          '<div class="label">Pending</div>' +
          '<div class="value mono">' + pending + '</div>' +
          '<div class="sub">' + highOpen + ' high priority open</div>' +
        '</div>' +
        '<div class="stat-card accent-gold">' +
          '<div class="label">Streak</div>' +
          '<div class="value mono">' + state.streak + '</div>' +
          '<div class="sub">day' + (state.streak === 1 ? '' : 's') + ' fully cleared</div>' +
        '</div>' +
        '<div class="stat-card">' +
          '<div class="label">Last 7 Days</div>' +
          '<div class="spark-bars">' + bars + '</div>' +
          '<div class="spark-labels">' + labels + '</div>' +
        '</div>' +
      '</div>';
  }

  function filteredTasks() {
    var tasks = state.day.tasks;
    if (state.filter === "active") return tasks.filter(function (t) { return !t.done; });
    if (state.filter === "completed") return tasks.filter(function (t) { return t.done; });
    return tasks;
  }

  function fmtBytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return Math.round(n / 1024 * 10) / 10 + ' KB';
    return Math.round(n / 1024 / 1024 * 10) / 10 + ' MB';
  }

  function renderCommentPanel(t) {
    var attachment = t.attachment
      ? '<span class="attachment-chip">' +
          '<span class="att-name" title="' + esc(t.attachment.name) + '">' + esc(t.attachment.name) + '</span>' +
          '<span class="att-size">' + fmtBytes(t.attachment.size) + '</span>' +
          '<a class="att-download" href="' + t.attachment.dataUrl + '" download="' + esc(t.attachment.name) + '" aria-label="Download attachment">' + ICONS.download + '</a>' +
          '<button class="att-remove" type="button" data-action="remove-attachment" data-id="' + t.id + '" aria-label="Remove attachment">' + ICONS.close + '</button>' +
        '</span>'
      : '<label class="attach-btn">' + ICONS.paperclip + ' Attach document' +
          '<input type="file" data-action="attach-file" data-id="' + t.id + '" />' +
        '</label>';

    return '' +
      '<div class="comment-panel">' +
        '<textarea rows="3" placeholder="Add notes for this task&hellip;" data-action="edit-comment" data-id="' + t.id + '">' + esc(t.comment || '') + '</textarea>' +
        '<div class="attach-row">' +
          attachment +
          (t.attachment ? '<span class="attach-note">1 file attached</span>' : '<span class="attach-note">up to 4MB</span>') +
        '</div>' +
      '</div>';
  }

  function renderTaskItem(t) {
    var metaParts = [];
    if (t.carriedFrom) metaParts.push('carried from ' + fmtShort(parseDateKey(t.carriedFrom)));
    if (t.due) metaParts.push('due ' + t.due);
    var meta = metaParts.join(' \u00b7 ');
    var isOpen = !!state.expandedComments[t.id];
    var hasContent = !!(t.comment && t.comment.trim()) || !!t.attachment;
    return '' +
      '<li>' +
        '<button class="stamp' + (t.done ? ' done' : '') + '" data-action="toggle-task" data-id="' + t.id + '" aria-label="Toggle task"></button>' +
        '<div class="entry-main">' +
          '<span class="entry-text' + (t.done ? ' done' : '') + '">' + esc(t.text) + '</span>' +
          (meta ? '<span class="entry-meta' + (t.carriedFrom ? ' carried' : '') + '">' + esc(meta) + '</span>' : '') +
        '</div>' +
        '<span class="prio-pill ' + t.priority + '">' + PRIORITY_LABEL[t.priority] + '</span>' +
        '<button class="comment-toggle' + (hasContent ? ' has-content' : '') + (isOpen ? ' open' : '') + '" data-action="toggle-comments" data-id="' + t.id + '" aria-label="Toggle notes">' +
          ICONS.comment + (hasContent ? ' \u2022' : '') +
        '</button>' +
        '<button class="del-btn" data-action="delete-task" data-id="' + t.id + '" aria-label="Delete task">' + ICONS.trash + '</button>' +
        (isOpen ? renderCommentPanel(t) : '') +
      '</li>';
  }

  function renderPanel() {
    var tasks = filteredTasks();
    var items = tasks.length
      ? tasks.map(renderTaskItem).join('')
      : '<li class="empty-note">' + (state.day.tasks.length ? 'Nothing here for this filter.' : 'No tasks logged yet — add the first one below.') + '</li>';

    var filters = [
      { id: "all", label: "All" },
      { id: "active", label: "Active" },
      { id: "completed", label: "Completed" }
    ].map(function (f) {
      return '<button class="' + (state.filter === f.id ? 'active' : '') + '" data-action="set-filter" data-filter="' + f.id + '">' + f.label + '</button>';
    }).join('');

    return '' +
      '<div class="panel">' +
        '<h2>Work Tasks</h2>' +
        '<p class="panel-sub">' + fmtDate(state.currentDate) + '</p>' +
        '<form class="add-row" data-form="task">' +
          '<input type="text" name="text" placeholder="Add a task&hellip;" maxlength="140" />' +
          '<select name="priority">' +
            '<option value="low">Low</option>' +
            '<option value="medium" selected>Medium</option>' +
            '<option value="high">High</option>' +
          '</select>' +
          '<input type="date" name="due" />' +
          '<button type="submit" aria-label="Add task">' + ICONS.plus + '</button>' +
        '</form>' +
        '<div class="filter-row">' + filters + '</div>' +
        '<ul class="entries">' + items + '</ul>' +
      '</div>';
  }

  function render() {
    var isToday = isSameDay(state.currentDate, nowIST());
    var app = document.getElementById('app');
    app.innerHTML = '' +
      '<div class="wrap">' +
        '<div class="banner' + (usingMemoryFallback ? ' show' : '') + '">' +
          '&#9888;&#65039; Browser storage isn\'t available in this preview, so tasks are held in memory for this session only. Download the file and open it directly in a browser (or host it) to get real persistent saving.' +
        '</div>' +
        '<div class="masthead">' +
          '<div>' +
            '<p class="eyebrow">Daily Task Ledger</p>' +
            '<h1 class="title">Work Tasks</h1>' +
          '</div>' +
          '<div style="display:flex;align-items:center;gap:14px;">' +
            '<div class="streak-badge">' + ICONS.flame + ' ' + state.streak + ' day' + (state.streak === 1 ? '' : 's') + ' streak</div>' +
            '<div class="datebar">' +
              '<button data-action="prev-day" aria-label="Previous day">' + ICONS.chevronLeft + '</button>' +
              '<span class="dstr">' + fmtDate(state.currentDate) + '</span>' +
              '<button data-action="next-day" aria-label="Next day">' + ICONS.chevronRight + '</button>' +
              (isToday ? '' : '<button class="today-btn" data-action="today-jump">TODAY</button>') +
            '</div>' +
          '</div>' +
        '</div>' +
        renderDashboard() +
        renderPanel() +
        '<div class="footer-row">' +
          '<button class="reset-btn" data-action="reset-day">' + ICONS.reset + ' Clear this day\'s tasks</button>' +
          '<span class="storage-note">' + (usingMemoryFallback ? 'in-memory (session only)' : (state.storageOk ? 'saved to localStorage' : 'save failed — check browser storage settings')) + '</span>' +
        '</div>' +
      '</div>';
  }

  // ---- event delegation -------------------------------------------------
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var action = btn.getAttribute('data-action');
    switch (action) {
      case 'prev-day': goPrevDay(); break;
      case 'next-day': goNextDay(); break;
      case 'today-jump': goToday(); break;
      case 'toggle-task': toggleTask(btn.getAttribute('data-id')); break;
      case 'delete-task': deleteTask(btn.getAttribute('data-id')); break;
      case 'set-filter': setFilter(btn.getAttribute('data-filter')); break;
      case 'reset-day': resetDay(); break;
      case 'toggle-comments': toggleComments(btn.getAttribute('data-id')); break;
      case 'remove-attachment': removeAttachment(btn.getAttribute('data-id')); break;
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target.matches('textarea[data-action="edit-comment"]')) {
      editComment(e.target.getAttribute('data-id'), e.target.value);
    }
  });

  document.addEventListener('change', function (e) {
    if (e.target.matches('input[type=file][data-action="attach-file"]')) {
      var id = e.target.getAttribute('data-id');
      var file = e.target.files && e.target.files[0];
      attachFile(id, file);
      e.target.value = '';
    }
  });

  document.addEventListener('submit', function (e) {
    var form = e.target.closest('form[data-form="task"]');
    if (!form) return;
    e.preventDefault();
    var text = form.querySelector('input[name=text]').value;
    var priority = form.querySelector('select[name=priority]').value;
    var due = form.querySelector('input[name=due]').value;
    addTask(text, priority, due);
    form.querySelector('input[name=text]').value = '';
    form.querySelector('input[name=due]').value = '';
  });

  // ---- init -------------------------------------------------------
  rolloverPastDays();
  loadCurrentDay();
  loadWeek();
  render();
})();
</script>
</body>
</html>
