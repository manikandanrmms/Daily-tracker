:0}.workspace-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.add-row{display:grid;grid-template-columns:1fr 130px 145px 50px;gap:8px;background:#f8f7fc;border:1px solid #ece9f6;border-radius:17px;padding:8px;margin-bottom:14px}.add-row input,.add-row select{height:48px;border:1px solid #e5e2ee;border-radius:12px;background:#fff;padding:0 13px;color:#4e4a62;outline:none}.add-row input:focus,.add-row select:focus{border-color:#b8adff;box-shadow:0 0 0 4px rgba(105,85,232,.08)}.add-row button{border:0;border-radius:13px;background:linear-gradient(135deg,var(--purple),#4f38c9);color:#fff;font-size:22px;box-shadow:0 9px 20px rgba(105,85,232,.24);transition:.2s}.add-row button:hover{transform:translateY(-2px) scale(1.03)}.filters{display:flex;gap:7px;margin-bottom:14px}.filters button{border:1px solid var(--line);background:#fff;color:#88869a;border-radius:999px;padding:8px 14px;font:500 10px 'DM Mono'}.filters button.active{background:var(--purple);color:#fff;border-color:var(--purple);box-shadow:0 8px 18px rgba(105,85,232,.18)}.task-list{display:grid;gap:9px}.task{display:grid;grid-template-columns:32px 1fr auto auto auto;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:15px 16px;background:#fff;transition:.22s;animation:taskIn .35s both}.task:hover{transform:translateY(-2px);box-shadow:0 12px 25px rgba(54,45,112,.07)}.check{width:27px;height:27px;border-radius:9px;border:2px solid #aaa2e9;background:#fff;display:grid;place-items:center;color:#fff}.check.done{background:var(--purple);border-color:var(--purple);box-shadow:0 0 0 5px #efedff}.check.done:after{content:'✓';font-weight:700}.task-text{font-weight:600;font-size:14px}.task.done .task-text{text-decoration:line-through;color:#aaa7b4}.task-meta{font:500 9px 'DM Mono';color:#aaa7b5;margin-top:4px}.priority{font:500 9px 'DM Mono';padding:6px 9px;border-radius:999px}.priority.low{background:#f3f4f6;color:#777}.priority.medium{background:#fff6df;color:#b17b21}.priority.high{background:#fff0f6;color:#d44e88}.icon-btn{border:0;background:transparent;color:#aaa7b6;padding:7px;border-radius:9px}.icon-btn:hover{background:#f3f1ff;color:var(--purple)}.empty{min-height:380px;border:1px dashed #dfdcea;border-radius:18px;display:grid;place-items:center;text-align:center;color:#aaa7b6;font-size:13px;background:linear-gradient(135deg,#fff,#faf9ff)}.empty b{display:block;color:#4c4860;font:600 18px 'Space Grotesk';margin-bottom:5px}.view{display:none}.view.active{display:block;animation:viewIn .3s}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.cal-head{font:500 9px 'DM Mono';color:#aaa;text-align:center;padding:5px}.cal-day{min-height:88px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:9px;text-align:left;color:#555;transition:.2s}.cal-day:hover{border-color:#cfc7ff;transform:translateY(-2px)}.cal-day.muted{opacity:.45}.cal-day.today{outline:2px solid #c9c0ff}.cal-day strong{font:600 11px 'DM Mono'}.cal-dot{width:6px;height:6px;border-radius:50%;background:var(--purple);display:inline-block;margin:7px 4px 0 0}.cal-count{font-size:9px;color:#999}.analytics-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.analytics-card,.setting-card,.focus-timer{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px}.big-bars{height:250px;display:flex;align-items:flex-end;gap:12px}.big-bars .bar{min-width:22px}.metric-row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-size:12px}.metric-row:last-child{border:0}.timer{text-align:center;padding:28px}.timer-display{font:700 78px 'Space Grotesk';letter-spacing:-.06em;color:var(--purple);margin:20px}.timer-mode{color:var(--muted);font:500 10px 'DM Mono';letter-spacing:.12em;text-transform:uppercase}.timer-controls{display:flex;justify-content:center;gap:8px}.primary{border:0;background:var(--purple);color:#fff;border-radius:12px;padding:11px 18px}.secondary{border:1px solid var(--line);background:#fff;color:#666;border-radius:12px;padding:11px 18px}.setting-grid{display:grid;gap:14px}.setting-card h3{font:600 17px 'Space Grotesk';margin:0 0 6px}.setting-card p{font-size:12px;color:var(--muted);margin:0 0 16px}.setting-actions{display:flex;gap:8px;flex-wrap:wrap}.file-input{display:none}.footer{display:flex;justify-content:space-between;color:#aaa7b6;font:500 10px 'DM Mono';padding:13px 4px}.floating-character{position:fixed;left:10px;bottom:10px;width:135px;height:122px;z-index:90;pointer-events:none;filter:drop-shadow(0 12px 14px rgba(65,45,130,.12))}.floating-character .bubble{left:0;top:-15px;transform:scale(.78);transform-origin:left bottom}.mobile-nav{display:none}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}@keyframes cardFloat{0%,100%{transform:rotate(4deg) translateY(0)}50%{transform:rotate(1deg) translateY(-8px)}}@keyframes bubble{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes glow{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}@keyframes spinSpark{50%{transform:scale(1.3) rotate(20deg)}}@keyframes barIn{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes taskIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes viewIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

@media(max-width:760px){body{padding-bottom:62px}.sidebar{display:none}.main{width:100%;margin:0;padding:14px}.topbar{align-items:flex-start}.topbar h1{font-size:24px}.datebar .date-label{min-width:120px;font-size:10px}.hero{min-height:360px}.hero-copy{padding:28px 24px}.hero-copy h2{font-size:39px}.hero-art{position:relative;width:100%;height:170px}.hero-character{left:24px;bottom:-5px;width:180px;height:162px}.focus-card{right:18px;bottom:14px;transform:scale(.8) rotate(3deg);transform-origin:bottom right}.productivity{right:20px;top:10px}.glow{right:30px;top:20px}.stats{grid-template-columns:1fr 1fr}.workspace{padding:18px;min-height:570px}.workspace-head{display:block}.add-row{grid-template-columns:1fr 1fr}.add-row input:first-child{grid-column:1/-1}.add-row button{grid-column:2}.task{grid-template-columns:30px 1fr auto}.task .priority{grid-column:2}.task .icon-btn{grid-row:1/3}.analytics-grid{grid-template-columns:1fr}.calendar-grid{gap:4px}.cal-day{min-height:58px;padding:6px}.floating-character{width:92px;height:84px;left:5px;bottom:62px}.mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(6,1fr);left:8px;right:8px;bottom:8px;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:17px;padding:5px;z-index:80;box-shadow:0 15px 35px rgba(45,40,100,.13)}.mobile-nav button{border:0;background:transparent;color:#88869b;border-radius:12px;padding:7px 2px;font-size:9px}.mobile-nav button.active{background:#f0edff;color:var(--purple);font-weight:700}.mobile-nav span{display:block;font-size:14px;margin-bottom:2px}.footer{display:none}}

<script>
(function(){
'use strict';
var DB_NAME='DailyTaskLedgerDB', DB_VERSION=1, STORE='days', SETTINGS='settings';
var PRIORITY_LABEL={low:'Low',medium:'Medium',high:'High'};
var state={date:new Date(),day:{tasks:[],rolledOver:false},view:'dashboard',filter:'all',week:[],monthCursor:new Date(),db:null,timer:{seconds:25*60,running:false,mode:'Focus',interval:null}};
function pad(n){return String(n).padStart(2,'0')}
function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseKey(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function fmt(d){return d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function fmtShort(d){return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}
function esc(s){var x=document.createElement('div');x.textContent=s;return x.innerHTML}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36)}
function nowIST(){var p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());var g=t=>+p.find(x=>x.type===t).value;return new Date(g('year'),g('month')-1,g('day'))}
function completion(day){if(!day.tasks.length)return 0;return Math.round(day.tasks.filter(t=>t.done).length/day.tasks.length*100)}
function openDB(){return new Promise(function(resolve,reject){var r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=function(){var db=r.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'date'});if(!db.objectStoreNames.contains(SETTINGS))db.createObjectStore(SETTINGS,{keyPath:'key'})};r.onsuccess=function(){state.db=r.result;resolve()};r.onerror=function(){reject(r.error)}})}
function dbGet(date){return new Promise(function(resolve,reject){var r=state.db.transaction(STORE,'readonly').objectStore(STORE).get(key(date));r.onsuccess=function(){resolve(r.result||{date:key(date),tasks:[],rolledOver:false})};r.onerror=function(){reject(r.error)}})}
function dbPut(day,date){return new Promise(function(resolve,reject){var r=state.db.transaction(STORE,'readwrite').objectStore(STORE).put({date:key(date),tasks:day.tasks,rolledOver:!!day.rolledOver});r.onsuccess=function(){resolve()};r.onerror=function(){reject(r.error)}})}
function dbAll(){return new Promise(function(resolve,reject){var r=state.db.transaction(STORE,'readonly').objectStore(STORE).getAll();r.onsuccess=function(){resolve(r.result||[])};r.onerror=function(){reject(r.error)}})}
function migrateLocalStorage(){return new Promise(function(resolve){try{var tx=state.db.transaction(STORE,'readwrite'),store=tx.objectStore(STORE),found=0;for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('worktasks:')===0&&k!=='worktasks:meta'){var raw=localStorage.getItem(k);try{var d=JSON.parse(raw);var date=k.replace('worktasks:','');if(d&&Array.isArray(d.tasks)){store.put({date:date,tasks:d.tasks,rolledOver:!!d.rolledOver});found++}}catch(e){}}}tx.oncomplete=function(){resolve(found)}}catch(e){resolve(0)}})}
async function rolloverPastDays(){
  var todayKey=key(nowIST());
  var setting=await new Promise(function(resolve,reject){var r=state.db.transaction(SETTINGS,'readonly').objectStore(SETTINGS).get('lastRollover');r.onsuccess=function(){resolve(r.result?r.result.value:null)};r.onerror=function(){reject(r.error)}});
  if(!setting){
    try{var legacy=localStorage.getItem('worktasks:meta');if(legacy){var m=JSON.parse(legacy);if(m&&m.lastRollover)setting=m.lastRollover}}catch(e){}
    if(!setting){
      await new Promise(function(resolve,reject){var r=state.db.transaction(SETTINGS,'readwrite').objectStore(SETTINGS).put({key:'lastRollover',value:todayKey});r.onsuccess=resolve;r.onerror=reject});
      return;
    }
  }
  var cursorKey=setting;
  while(cursorKey<todayKey){
    var cursorDate=parseKey(cursorKey),nextDate=addDays(cursorDate,1),nextKey=key(nextDate);
    var dayData=await dbGet(cursorDate);
    var undone=dayData.tasks.filter(function(t){return !t.done;});
    if(undone.length){
      dayData.tasks=dayData.tasks.filter(function(t){return t.done;});
      dayData.rolledOver=true;
      await dbPut(dayData,cursorDate);
      var nextData=await dbGet(nextDate);
      undone.forEach(function(t){t.carriedFrom=t.carriedFrom||cursorKey;nextData.tasks.push(t)});
      await dbPut(nextData,nextDate);
    }
    cursorKey=nextKey;
  }
  await new Promise(function(resolve,reject){var r=state.db.transaction(SETTINGS,'readwrite').objectStore(SETTINGS).put({key:'lastRollover',value:todayKey});r.onsuccess=resolve;r.onerror=reject});
}
function setStatus(t){document.getElementById('saveStatus').textContent=t;document.getElementById('dbStatus').textContent=t}
async function save(){try{await dbPut(state.day,state.date);setStatus('Saved to IndexedDB');renderAll()}catch(e){setStatus('Save failed')}}
async function loadDay(){state.day=await dbGet(state.date)}
async function loadWeek(){var arr=[];for(var i=6;i>=0;i--){var d=addDays(nowIST(),-i),day=await dbGet(d);arr.push({date:d,data:day})}state.week=arr}
async function init(){try{await openDB();var count=await dbAll();if(!count.length){var migrated=await migrateLocalStorage();if(migrated)count=await dbAll()}await rolloverPastDays();setStatus('Database ready');state.date=nowIST();state.monthCursor=new Date(state.date);await loadDay();await loadWeek();renderAll()}catch(e){console.error(e);setStatus('IndexedDB unavailable')}}
function tasks(){return state.day.tasks.filter(function(t){return state.filter==='all'||(state.filter==='active'&&!t.done)||(state.filter==='completed'&&t.done)})}
function statCards(){var done=state.day.tasks.filter(t=>t.done).length,total=state.day.tasks.length,pct=completion(state.day),pending=total-done,high=state.day.tasks.filter(t=>!t.done&&t.priority==='high').length;var bars=state.week.map(function(w){var h=Math.max(4,completion(w.data));return '<div class="bar '+(key(w.date)===key(nowIST())?'today':'')+'" style="height:'+h+'%" title="'+h+'%"></div>'}).join('');return '<div class="stats"><div class="stat"><div class="stat-label">Completion</div><div class="stat-value">'+(total?pct+'%':'—')+'</div><div class="stat-sub">'+done+' of '+total+' done</div></div><div class="stat"><div class="stat-label">Pending</div><div class="stat-value" style="color:var(--pink)">'+pending+'</div><div class="stat-sub">'+high+' high priority open</div></div><div class="stat"><div class="stat-label">Streak</div><div class="stat-value" style="color:var(--orange)">'+streak()+'</div><div class="stat-sub">days fully cleared</div></div><div class="stat"><div class="stat-label">Last 7 Days</div><div class="bar-chart">'+bars+'</div></div></div>'}
function streak(){var s=0;for(var i=state.week.length-1;i>=0;i--){var d=state.week[i].data;if(d.tasks.length&&d.tasks.every(t=>t.done)&&!d.rolledOver)s++;else break}return s}
function hero(){var pct=completion(state.day);return '<div class="hero"><div class="hero-copy"><p class="eyebrow">Focus workspace</p><h2>Turn your plans into progress.</h2><p>One calm space for today’s priorities, focus sessions and momentum.</p><div class="hero-badges"><span class="badge">✓ <strong>'+state.day.tasks.filter(t=>t.done).length+'</strong> completed</span><span class="badge">◷ <strong>'+state.day.tasks.filter(t=>!t.done).length+'</strong> remaining</span><span class="badge">🔥 <strong>'+streak()+'</strong> day streak</span></div></div><div class="hero-art"><div class="glow"></div><div class="productivity">✦ +12% productivity</div><div class="focus-card"><small>TODAY’S FOCUS</small><div class="ring" style="--pct:'+pct+'%"><b>'+pct+'%</b></div></div><div class="hero-character"><div class="speech">Let’s get it done! ✨</div><span class="spark">✦</span><svg viewBox="0 0 300 270"><ellipse cx="151" cy="218" rx="70" ry="28" fill="#d9d0ff" opacity=".7"/><rect x="92" y="128" width="116" height="92" rx="34" fill="#7355e8"/><path d="M103 153 Q150 180 197 153 L197 188 Q150 212 103 188Z" fill="#8e75f4" opacity=".65"/><circle cx="150" cy="103" r="56" fill="#ffd9bf"/><path d="M97 98 Q94 42 151 43 Q210 44 204 102 Q188 77 164 72 Q132 66 97 98Z" fill="#33275e"/><circle cx="130" cy="108" r="5" fill="#33275e"/><circle cx="171" cy="108" r="5" fill="#33275e"/><path d="M137 128 Q150 137 164 128" fill="none" stroke="#d16f83" stroke-width="4" stroke-linecap="round"/><path d="M108 157 Q73 159 65 190" fill="none" stroke="#ffd9bf" stroke-width="17" stroke-linecap="round"/><path d="M192 157 Q223 148 235 126" fill="none" stroke="#ffd9bf" stroke-width="17" stroke-linecap="round"/><circle cx="238" cy="121" r="11" fill="#ffd9bf"/><rect x="213" y="72" width="37" height="28" rx="7" transform="rotate(-12 213 72)" fill="#fff" stroke="#d8d0ff" stroke-width="2"/><path d="M219 86 l7 7 14-14" fill="none" stroke="#6d4aff" stroke-width="3" stroke-linecap="round"/><path d="M113 216 Q94 244 76 243" fill="none" stroke="#33275e" stroke-width="13" stroke-linecap="round"/><path d="M187 216 Q204 242 224 242" fill="none" stroke="#33275e" stroke-width="13" stroke-linecap="round"/><circle cx="72" cy="243" r="9" fill="#33275e"/><circle cx="228" cy="243" r="9" fill="#33275e"/></svg></div></div></div>'}
function taskList(){var list=tasks();if(!list.length)return '<div class="empty"><div><b>'+ (state.day.tasks.length?'Nothing here':'Your task space is ready')+'</b><span>'+(state.day.tasks.length?'Try another filter.':'Add your first task above and build your day.')+'</span></div></div>';return '<div class="task-list">'+list.map(function(t,i){var meta=(t.due?'Due '+t.due:'')+(t.carriedFrom?' · carried from '+fmtShort(parseKey(t.carriedFrom)):'');return '<div class="task '+(t.done?'done':'')+'" style="animation-delay:'+(i*.035)+'s"><button class="check '+(t.done?'done':'')+'" data-action="toggle" data-id="'+t.id+'" aria-label="Complete task"></button><div><div class="task-text">'+esc(t.text)+'</div>'+(meta?'<div class="task-meta">'+esc(meta)+'</div>':'')+'</div><span class="priority '+t.priority+'">'+PRIORITY_LABEL[t.priority]+'</span><button class="icon-btn" data-action="comment" data-id="'+t.id+'">💬</button><button class="icon-btn" data-action="delete" data-id="'+t.id+'">×</button>'+(t.comment?'<div style="grid-column:2/-1;font-size:11px;color:#8b8999;padding-top:4px">'+esc(t.comment)+'</div>':'')+'</div>'}).join('')+'</div>'}
function taskWorkspace(){return '<div class="workspace"><div class="workspace-head"><div><h2>My Tasks</h2><p>'+fmt(state.date)+' · '+state.day.tasks.length+' total tasks</p></div><button class="secondary" data-action="quick-focus">Start focus</button></div><form class="add-row" id="taskForm"><input name="text" maxlength="160" placeholder="What needs to get done?" autofocus><select name="priority"><option value="medium">Medium priority</option><option value="low">Low priority</option><option value="high">High priority</option></select><input type="date" name="due"><button type="submit">+</button></form><div class="filters"><button class="'+(state.filter==='all'?'active':'')+'" data-action="filter" data-filter="all">All</button><button class="'+(state.filter==='active'?'active':'')+'" data-action="filter" data-filter="active">Active</button><button class="'+(state.filter==='completed'?'active':'')+'" data-action="filter" data-filter="completed">Completed</button></div>'+taskList()+'</div>'}
function dashboard(){return hero()+statCards()+taskWorkspace()}
function focusView(){var m=Math.floor(state.timer.seconds/60),s=state.timer.seconds%60;return '<div class="workspace"><div class="workspace-head"><div><h2>Focus Session</h2><p>A distraction-free timer connected to today’s tasks.</p></div></div><div class="analytics-grid"><div class="focus-timer timer"><div class="timer-mode">'+state.timer.mode+' session</div><div class="timer-display">'+pad(m)+':'+pad(s)+'</div><div class="timer-controls"><button class="primary" data-action="timer-toggle">'+(state.timer.running?'Pause':'Start')+'</button><button class="secondary" data-action="timer-reset">Reset</button></div></div><div class="analytics-card"><h3 style="font-family:Space Grotesk;margin-top:0">Today’s momentum</h3><div class="metric-row"><span>Completed</span><b>'+state.day.tasks.filter(t=>t.done).length+'</b></div><div class="metric-row"><span>Remaining</span><b>'+state.day.tasks.filter(t=>!t.done).length+'</b></div><div class="metric-row"><span>Completion</span><b>'+completion(state.day)+'%</b></div><p style="font-size:11px;color:var(--muted);line-height:1.6">Finish one task, then return here for another focused sprint.</p></div></div></div>'}
function calendarView(){var d=new Date(state.monthCursor.getFullYear(),state.monthCursor.getMonth(),1),start=d.getDay(),days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),prev=new Date(d.getFullYear(),d.getMonth(),0).getDate();var cells='';for(var i=0;i<42;i++){var n=i-start+1,dd,muted=false;if(n<1){n=prev+n;dd=new Date(d.getFullYear(),d.getMonth()-1,n);muted=true}else if(n>days){n=n-days;dd=new Date(d.getFullYear(),d.getMonth()+1,n);muted=true}else dd=new Date(d.getFullYear(),d.getMonth(),n);var dayData=state.week.find(w=>key(w.date)===key(dd));var count=dayData?dayData.data.tasks.length:0;var isToday=key(dd)===key(nowIST());cells+='<button class="cal-day '+(muted?'muted ':'')+(isToday?'today':'')+'" data-action="calendar-day" data-date="'+key(dd)+'"><strong>'+n+'</strong><div>'+ (count?'<span class="cal-dot"></span><span class="cal-count">'+count+' task'+(count===1?'':'s')+'</span>':'')+'</div></button>'}return '<div class="workspace"><div class="workspace-head"><div><h2>Calendar</h2><p>Choose a day to view its task list.</p></div><div class="datebar"><button data-action="month-prev">‹</button><span class="date-label">'+d.toLocaleDateString('en-IN',{month:'long',year:'numeric'})+'</span><button data-action="month-next">›</button></div></div><div class="calendar-grid">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>'<div class="cal-head">'+x+'</div>').join('')+cells+'</div></div>'}
function analyticsView(){var max=1;state.week.forEach(w=>{max=Math.max(max,w.data.tasks.length)});var bars=state.week.map(w=>{var h=w.data.tasks.length?Math.max(5,(w.data.tasks.filter(t=>t.done).length/w.data.tasks.length)*100):4;return '<div style="flex:1;text-align:center"><div class="big-bars" style="height:220px;display:flex;align-items:flex-end;justify-content:center"><div class="bar '+(key(w.date)===key(nowIST())?'today':'')+'" style="height:'+h+'%;width:28px"></div></div><div style="font:500 9px DM Mono;color:#999">'+w.date.toLocaleDateString('en-IN',{weekday:'narrow'})+'</div></div>'}).join('');var total=state.week.reduce((a,w)=>a+w.data.tasks.length,0),done=state.week.reduce((a,w)=>a+w.data.tasks.filter(t=>t.done).length,0);return '<div class="workspace"><div class="workspace-head"><div><h2>Analytics</h2><p>Your last 7 days at a glance.</p></div></div><div class="analytics-grid"><div class="analytics-card"><h3 style="font:600 17px Space Grotesk;margin-top:0">Completion activity</h3><div style="display:flex;gap:8px">'+bars+'</div></div><div class="analytics-card"><h3 style="font:600 17px Space Grotesk;margin-top:0">Totals</h3><div class="metric-row"><span>Tasks created</span><b>'+total+'</b></div><div class="metric-row"><span>Tasks completed</span><b>'+done+'</b></div><div class="metric-row"><span>Overall rate</span><b>'+ (total?Math.round(done/total*100):0)+'%</b></div><div class="metric-row"><span>Current streak</span><b>'+streak()+' days</b></div></div></div></div>'}
function settingsView(){return '<div class="workspace"><div class="workspace-head"><div><h2>Preferences & Data</h2><p>Your tasks are stored locally in the browser database.</p></div></div><div class="setting-grid"><div class="setting-card"><h3>Database</h3><p>IndexedDB keeps your tasks, comments and attachments available between sessions without a server.</p><div class="setting-actions"><button class="primary" data-action="export">Export backup</button><label class="secondary" style="cursor:pointer">Import backup<input class="file-input" type="file" accept="application/json" data-action="import"></label><button class="secondary" data-action="clear-db">Clear all data</button></div></div><div class="setting-card"><h3>Current day</h3><p>'+fmt(state.date)+' · '+state.day.tasks.length+' tasks · '+completion(state.day)+'% complete</p><button class="secondary" data-action="reset-day">Clear today’s tasks</button></div></div></div>'}
function renderAll(){document.getElementById('topDate').textContent=fmt(state.date);var views={dashboard:dashboard,tasks:taskWorkspace,focus:focusView,calendar:calendarView,analytics:analyticsView,settings:settingsView};Object.keys(views).forEach(function(v){document.getElementById('view-'+v).innerHTML=views[v]();document.getElementById('view-'+v).classList.toggle('active',state.view===v)});document.querySelectorAll('[data-view]').forEach(function(b){b.classList.toggle('active',b.dataset.view===state.view)});document.getElementById('pageTitle').textContent={dashboard:'Dashboard',tasks:'My Tasks',focus:'Focus Session',calendar:'Calendar',analytics:'Analytics',settings:'Preferences'}[state.view]}
async function changeDate(d){state.date=d;state.monthCursor=new Date(d);state.filter='all';await loadDay();await loadWeek();renderAll()}
async function addTask(form){var text=form.text.value.trim();if(!text)return;state.day.tasks.push({id:uid(),text:text,done:false,priority:form.priority.value,due:form.due.value||null,comment:'',attachment:null});await save();form.reset()}
async function toggle(id){var t=state.day.tasks.find(x=>x.id===id);if(t){t.done=!t.done;await save()}}
async function del(id){state.day.tasks=state.day.tasks.filter(x=>x.id!==id);await save()}
function setView(v){state.view=v;renderAll()}
function tickTimer(){if(!state.timer.running)return;state.timer.seconds--;if(state.timer.seconds<=0){state.timer.running=false;clearInterval(state.timer.interval);alert(state.timer.mode+' session complete!');state.timer.seconds=state.timer.mode==='Focus'?25*60:5*60}renderAll()}
function toggleTimer(){state.timer.running=!state.timer.running;if(state.timer.running){clearInterval(state.timer.interval);state.timer.interval=setInterval(tickTimer,1000)}else clearInterval(state.timer.interval);renderAll()}
function resetTimer(){state.timer.running=false;clearInterval(state.timer.interval);state.timer.seconds=state.timer.mode==='Focus'?25*60:5*60;renderAll()}
function exportData(){dbAll().then(function(data){var blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),days:data},null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='daily-task-ledger-backup.json';a.click();URL.revokeObjectURL(a.href)})}
function importData(file){var r=new FileReader();r.onload=async function(){try{var obj=JSON.parse(r.result);if(!obj.days)throw Error('Invalid backup');for(var i=0;i<obj.days.length;i++)await new Promise(function(resolve,reject){var req=state.db.transaction(STORE,'readwrite').objectStore(STORE).put(obj.days[i]);req.onsuccess=resolve;req.onerror=reject});await loadDay();await loadWeek();renderAll();setStatus('Backup imported')}catch(e){alert('Could not import that backup.')}};r.readAsText(file)}
async function clearAll(){if(!confirm('Delete every task from the browser database?'))return;await new Promise(function(resolve,reject){var r=state.db.transaction(STORE,'readwrite').objectStore(STORE).clear();r.onsuccess=resolve;r.onerror=reject});await loadDay();await loadWeek();renderAll();setStatus('Database cleared')}
async function clearDay(){if(!confirm('Clear all tasks for '+fmt(state.date)+'?'))return;state.day={tasks:[],rolledOver:false};await save()}
document.addEventListener('click',async function(e){var nav=e.target.closest('[data-view]');if(nav){setView(nav.dataset.view);return}var a=e.target.closest('[data-action]');if(!a)return;var action=a.dataset.action;if(action==='prev-day')return changeDate(addDays(state.date,-1));if(action==='next-day')return changeDate(addDays(state.date,1));if(action==='today')return changeDate(nowIST());if(action==='toggle')return toggle(a.dataset.id);if(action==='delete')return del(a.dataset.id);if(action==='filter'){state.filter=a.dataset.filter;renderAll();return}if(action==='quick-focus'){setView('focus');toggleTimer();return}if(action==='timer-toggle')return toggleTimer();if(action==='timer-reset')return resetTimer();if(action==='month-prev'){state.monthCursor=new Date(state.monthCursor.getFullYear(),state.monthCursor.getMonth()-1,1);renderAll();return}if(action==='month-next'){state.monthCursor=new Date(state.monthCursor.getFullYear(),state.monthCursor.getMonth()+1,1);renderAll();return}if(action==='calendar-day'){return changeDate(parseKey(a.dataset.date))}if(action==='reset-day')return clearDay();if(action==='export')return exportData();if(action==='clear-db')return clearAll();if(action==='comment'){var t=state.day.tasks.find(x=>x.id===a.dataset.id);if(t){var c=prompt('Task note:',t.comment||'');if(c!==null){t.comment=c;await save()}}}});
document.addEventListener('submit',function(e){if(e.target.id==='taskForm'){e.preventDefault();addTask(e.target)}});document.addEventListener('change',function(e){if(e.target.matches('input[data-action="import"]')&&e.target.files[0])importData(e.target.files[0])});
init();
})();
</script>
